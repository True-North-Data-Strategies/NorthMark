name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tracked public files
        run: python tools/check_public_files.py
      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Refuse a wheel or sdist that carries private files
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile
          names = []
          for wheel in glob.glob("dist/*.whl"):
              names += zipfile.ZipFile(wheel).namelist()
          for sdist in glob.glob("dist/*.tar.gz"):
              names += tarfile.open(sdist).getnames()
          private = [n for n in names if "local-assets" in n or n.lower().endswith((".png", ".jpg", ".svg", ".pdf"))]
          sys.exit(f"Private or artwork files in the build: {private}" if private else 0)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
      - name: Publish the GitHub release with the build files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
