name: Tests and public-file check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Cairo runtime
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install tool and SVG support
        run: python -m pip install '.[svg]'
      - name: Run all checks
        run: python -m unittest discover -s tests -v
      - name: Check tracked public files
        run: python tools/check_public_files.py
