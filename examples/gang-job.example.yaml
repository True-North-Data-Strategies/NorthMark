# Example gang-sheet job for `logo-sizes gang`.
# Copy it to local-assets/orders/<date>-<name>.yaml (git ignores that folder).
#
# Items can reference finished DTF outputs by design, placement and variant
# (resolved under the output folder), or point at any transparent PNG with
# `file` and an explicit size in inches. Sizes keep their aspect ratio.

job: example-job

sheet:
  width_in: 22                  # vendor sheet width; the placements file carries the default
  lengths_ft: [2, 5, 10, 15, 20]  # standard lengths to choose from; confirm at order time
  gap_in: 0.25                  # lowest published industry minimum between transfers; widen for contour cuts
  margin_in: 0.5                # conservative clear border; the lowest published minimum is 0.25
  rotate: true                  # allow 90 degree rotation to pack tighter

# Ninja Transfers accepts an uploaded gang sheet only when it is fully vector. For Ninja,
# upload the 300 DPI PNGs from each design's dtf/ folder into its online gang sheet builder
# and reproduce the layout in layout.json, or use Auto Build. The sheet PNG and PDF this
# tool writes are the cut plan, and the upload for printers that accept raster sheets.

items:
  - {design: example-brand, placement: full-back, variant: original, qty: 2}
  - {design: example-brand, placement: left-chest, variant: reverse, qty: 2}
  - {file: ../input/example-sticker.png, width_in: 4, height_in: 6, qty: 1}

prices:                         # optional; enter the vendor's current prices to compare costs
  currency: USD
  gang_sheet_by_length_ft: {2: 0.00, 5: 0.00, 10: 0.00}   # replace zeros with the live prices
  by_size:                      # per-transfer price for each placement at quantity one
    full-back: 0.00
    left-chest: 0.00
