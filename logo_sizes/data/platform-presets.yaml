  # Rectangular sizes with safe areas. Optional; select them explicitly.
  - name: youtube-banner-2560
    width: 2560
    height: 1440
    group: banners
    purpose: "Channel banner; art is kept inside the 1546 x 423 safe area"
    safe_area: [1546, 423]
    max_kb: 6144
    background: true
    standard: false
    source: "https://www.elev8or.io/tools/youtube-banner-resizer"
    checked: 2026-10-18
  - name: x-header-1500
    width: 1500
