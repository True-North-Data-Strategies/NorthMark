# Export sizes for `logo-sizes kit`. Convenient starting sizes, not a promise of
# platform acceptance. Sizes marked standard are written by a run with no size
# flags; the others are available with --group, --preset or a brand file.
#
# Each entry records where its numbers came from and when they were read.
# Platforms change their requirements, so check before uploading.

checked: 2026-10-18

presets:
