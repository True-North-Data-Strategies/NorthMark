[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "create-logos-all-sizes"
version = "3.0.0"
description = "Safe logo resizing, transparent color variants, previews and portable brand kits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=12.1,<14"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
svg = ["CairoSVG>=2.8,<3"]

[project.scripts]
logo-sizes = "logo_sizes.cli:main"

[project.urls]
Repository = "https://github.com/True-North-Data-Strategies/create-logos-all-sizes"
Issues = "https://github.com/True-North-Data-Strategies/create-logos-all-sizes/issues"

[tool.setuptools]
packages = ["logo_sizes"]
