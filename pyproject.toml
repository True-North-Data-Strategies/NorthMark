[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "northmark"
version = "4.0.0"
description = "NorthMark: logo kits, 300 DPI DTF transfers and gang sheets from one clean master."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=12.1,<14", "PyYAML>=6,<7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
svg = ["CairoSVG>=2.8,<3"]
print = ["reportlab>=4,<6"]

[project.scripts]
northmark = "logo_sizes.cli:main"
logo-sizes = "logo_sizes.cli:main"

[project.urls]
Repository = "https://github.com/True-North-Data-Strategies/NorthMark"
Issues = "https://github.com/True-North-Data-Strategies/NorthMark/issues"

[tool.setuptools]
packages = ["logo_sizes"]

[tool.setuptools.package-data]
logo_sizes = ["data/*.yaml"]
